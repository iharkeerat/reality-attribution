name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check research documentation and source syntax
        run: python tools/check_release.py
      - name: Verify archived GridWorld data
        run: python tools/verify_gridworld_enumeration.py
